# --------------------------------------------------
# Secret scanning のアラートから除外するパス
#
# ここに書いたパスは「アラートを出さない」だけである。
# **Push protection には効かない。** Push protection は除外設定を見ず、
# 検知したら push を止める（通したい場合はバイパスする）。
#
# したがって本ファイルの目的は、
# **テスト専用の資材で Security タブが埋まり、本物が見えなくなるのを防ぐこと**にある。
#
# 参考: https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
# --------------------------------------------------
paths-ignore:

  # --------------------------------------------------
  # 暗号・署名テスト用の証明書と秘密鍵（19 件）
  #
  # Public.Security（JWT / JWS / JWE / 鍵交換 / X.509）のテストと、
  # サンプルの SSL/TLS・クライアント証明書認証で使う。
  # **すべてテスト専用の自己署名で、実運用の証明書は含まない。**
  #
  # 実体は次で参照される。
  #   Frameworks/Tests/EncAndDecUtil, EncAndDecUtilCUI
  #   Frameworks/Tests/TestCode
  #   Samples/WS_sample ほか
  # --------------------------------------------------
  - "root/files/resource/X509/**"

  # --------------------------------------------------
  # ClickOnce の署名用（テンポラリ キー）
  #
  # WSClientWinCone_sample.csproj が拇印で証明書ストアを検索するため、
  # 当該証明書が無い環境ではビルドできない（BUILDING.md 4 節）。
  # 検証 3 本では MSB3482 / MSB3325 / MSB3321 を既知として除外している。
  # --------------------------------------------------
  - "root/programs/CS/Samples/WS_sample/WSClient_sample/WSClientWinCone_sample/WSClientWinCone_sample_TemporaryKey.pfx"

# --------------------------------------------------
# ここに足していないもの、と その理由
#
# ・テスト・サンプルの接続文字列（Password= を含む app.config / appsettings.json、49 件）
#     Non-provider patterns（汎用のパスワードらしき文字列）を**無効のまま**にしていれば
#     検知されない。既定は無効。
#     広く paths-ignore に足すと、本物を取りこぼす側のリスクが上がるため入れない。
#
# ・Frameworks/Tests/** や Samples/** をまとめて除外すること
#     範囲が広すぎる。**本物のキーを誤って置いたときに気付けなくなる。**
#     除外は「中身が分かっているファイル」に限る。
# --------------------------------------------------
