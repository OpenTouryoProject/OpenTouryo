# 受けブランチ（deps）に入った変更を windows-latest でビルドし、単体テストを回す。
#
# ＜位置づけ＞
#   リリース時の検証 3 本（RELEASE.md 3 節）のうち、1 本目と 2 本目を CI に載せたもの。
#   「何をビルドするか」の正はバッチ側、「合否の判定」の正は各 .ps1 にある。
#   ここには判定を書かない（書くと二重管理になる）。
#
# ＜3_SmokeTest.ps1 を含めない理由＞
#   IIS Express と aspnet_state、および Oracle / MySQL / PostgreSQL まで要るため。
#   詳細は BUILDING.md 9 節。
#
# ＜対象外＞
#   ・GUI アプリケーション（WinForms / WPF / 各ツールの画面）… RELEASE.md 4 節の手作業
#   ・SQL Server 以外の DBMS への接続 … 自動テストは /Dap SQL のみを使う
#     （TestSQLUtility は 4 DBMS の SQL 生成を検証するが、接続はしない）
#
# ＜署名エラーを除外している理由＞
#   WSClientWinCone_sample.csproj は ClickOnce の署名が有効で、証明書を拇印で指定し、
#   同梱の .pfx はパスワード保護されている。実行のたびに作り直される CI では用意できない。
#
#   ローカルと CI で出るコードが違うことに注意する。
#     ローカル : MSB3482（マニフェストの署名で失敗）
#              … .pfx が既にキー コンテナへ取り込まれており、最後の署名まで進むため
#     CI       : MSB3325 / MSB3321（キー ファイルの取り込みで失敗）
#              … ResolveKeySource が .pfx を取り込めず、署名に到達しないため
#
#   このため 3 つのコードを対象にし、さらに当該プロジェクトに限定する。
#   除外した内容はログに一覧されるので、握り潰しにはならない。

name: Build on Windows

on:
  push:
    branches: [deps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # ローカルの実測はビルド 5.8 分＋テスト 1.3 分。DB の導入と初期化を足して余裕を持たせる。
    timeout-minutes: 120

    env:
      # ankane/setup-sqlserver が設定する既定のパスワード。
      INITIAL_SA_PASSWORD: 'YourStrong!Passw0rd'
      # テストとサンプルの構成ファイルに直書きされている値。
      #   Data Source=localhost;Initial Catalog=Northwind;User ID=sa;Password=seigi@123;Encrypt=false;
      # 構成側を CI 用に書き換えると「実際に使われる設定」と乖離するため、DB 側を合わせる。
      SA_PASSWORD: 'seigi@123'
      # LocalServicesOnDocker の docker-compose.yml が指定する照合順序と同じ。
      COLLATION: 'Japanese_CI_AS'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1_BuildAll.ps1 は git を使わないため、既定の浅い clone のままでよい。
      # 2_RunAllTests.ps1 は git show HEAD: で期待値を取るが、これも浅い clone で足りる。
      - name: Build all
        shell: pwsh
        working-directory: root/programs
        run: .\1_BuildAll.ps1 -OutputDir "${{ runner.temp }}\BuildLogs" -IgnoreErrors 'error MSB(3482|3325|3321):.*WSClientWinCone_sample\.csproj'

      # ------------------------------------------------------------------
      # 単体テストのための SQL Server
      # ------------------------------------------------------------------
      # LocalServicesOnDocker の docker-compose はそのままでは使えない。
      # sqlserver サービスが Linux イメージ（mcr.microsoft.com/mssql/server）で、
      # windows-latest は Linux コンテナを動かせないため（多段のネストができない）。
      # 代わりに runner へ直接 SQL Server を入れ、同リポジトリの instnwnd.sql だけを使う。
      #
      # 第三者のアクションなのでコミットで固定する（v1 はタグではなくブランチ）。
      - name: Install SQL Server
        uses: ankane/setup-sqlserver@82b78e23506d0c8acfb64e05728ac450ff8a98c6 # v1
        with:
          accept-eula: true
          sqlserver-version: 2022

      - name: Set up Northwind
        shell: pwsh
        env:
          # LocalServicesOnDocker のコミットに固定する。
          # 中身は Microsoft 公式の Northwind DDL（約 1 MB）。
          NORTHWIND_URL: https://raw.githubusercontent.com/NetDevInfraWGinOSSConsortium/LocalServicesOnDocker/90763cd5f2aa681b1172d9277a2b133514fdaebe/sqlserver/init/instnwnd.sql
        run: |
          $ErrorActionPreference = 'Stop'

          # sqlcmd 18 以降は既定で暗号化するため -C（サーバー証明書を信頼）が要る。
          # 旧版は -C を解釈しないので、使えるかどうかを一度だけ判定する。
          $cflag = @()
          & sqlcmd -S localhost -U sa -P $env:INITIAL_SA_PASSWORD -C -Q "SELECT 1" *> $null
          if ($LASTEXITCODE -eq 0) { $cflag = @('-C') }

          function Invoke-Sql
          {
              param([string]$Password, [string]$Database, [string]$Query, [string]$File, [switch]$Raw)

              $a = @('-S', 'localhost', '-U', 'sa', '-P', $Password, '-b') + $cflag
              if ($Database) { $a += @('-d', $Database) }
              if ($Raw)      { $a += @('-h', '-1', '-W') }
              if ($Query)    { $a += @('-Q', $Query) }
              if ($File)     { $a += @('-i', $File) }
              & sqlcmd @a
          }

          # 構成ファイルに合わせてパスワードを変更する。
          Write-Host "sa のパスワードを構成ファイルに合わせます。"
          Invoke-Sql -Password $env:INITIAL_SA_PASSWORD -Query "ALTER LOGIN sa WITH PASSWORD = '$($env:SA_PASSWORD)'"
          if ($LASTEXITCODE -ne 0) { throw "sa のパスワードを変更できませんでした。" }

          $sql = Join-Path $env:RUNNER_TEMP 'instnwnd.sql'
          Invoke-WebRequest -Uri $env:NORTHWIND_URL -OutFile $sql
          Write-Host ("instnwnd.sql を取得しました（{0:N0} バイト）。" -f (Get-Item $sql).Length)

          # instnwnd.sql は DB を作らない（対象 DB の中で実行する）ため、先に CREATE する。
          # 照合順序は DB 既定として与える。Northwind の列は COLLATE 句を持たないので、
          # 各列がこれを継承する。
          #
          # 起動直後は一部のバッチが失敗して不完全なロードになることがあるため
          # （表だけできてデータが入らない等）、Shippers が 3 行あるかで検証して再試行する。
          # 判定方法は LocalServicesOnDocker の start-up.sh に合わせている。
          $loaded = $false

          foreach ($attempt in 1..3)
          {
              Write-Host "Northwind をロードします（$attempt 回目）。"

              # ヒアストリングは使わない。YAML のブロック スカラーはインデントを
              # 剥がすため、終端の "@ を行頭に置く必要があり、桁が衝突する。
              $drop   = "IF DB_ID('Northwind') IS NOT NULL BEGIN ALTER DATABASE Northwind SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE Northwind; END;"
              $create = "CREATE DATABASE Northwind COLLATE $($env:COLLATION);"

              Invoke-Sql -Password $env:SA_PASSWORD -Query "$drop $create"
              Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -File $sql *> $null

              $n = (Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -Raw `
                    -Query "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Shippers") -join ''
              if ($n.Trim() -eq '3') { $loaded = $true; break }

              Write-Host "  ロードが不完全です。再試行します。"
          }

          if (-not $loaded) { throw "Northwind のロードが完了しませんでした。" }

          # Northwind 標準には無い表。3_SmokeTest.ps1（将来）が使う。
          $orders2 = 'root/programs/CS/Samples/Bat_sample/RerunnableBatch_sample/CREATE ORDERS2.sql'
          Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -File $orders2 *> $null

          # 初期状態の確認（RELEASE.md 2 節と同じ観点）。
          $orders = (Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -Raw `
                     -Query "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Orders") -join ''
          Write-Host ("Northwind 準備完了 : Shippers=3  Orders={0}" -f $orders.Trim())

      # ------------------------------------------------------------------
      # テストが前提とする環境（C:\root と日本語ロケール）
      # ------------------------------------------------------------------
      - name: Set up C:\root and locale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 構成ファイルが C:\root\files\... を絶対パスで参照している。
          #   TestCode/App.config    FxXMLMSGDefinition / FxXMLSPDefinition
          #   SimpleBatch/app.config SqlTextFilePath
          # 無いと GetMessage が空を返し、SimpleBatch は
          #   resource file [...] was not found
          # で失敗する。コピーではなくジャンクションにして、実体を 1 つに保つ。
          if (-not (Test-Path 'C:\root'))
          {
              New-Item -ItemType Junction -Path 'C:\root' `
                       -Target (Join-Path $env:GITHUB_WORKSPACE 'root') | Out-Null
          }

          foreach ($p in @('C:\root\files\resource\Sql',
                           'C:\root\files\resource\Xml\MSGDefinition.xml',
                           'C:\root\files\resource\Xml\SPDefinition.xml'))
          {
              if (-not (Test-Path $p)) { throw "$p が見つかりません。" }
          }
          Write-Host "C:\root を配置しました。"

          # 期待値は日本語環境で生成されている。runner の既定は en-US で、
          # 「書式」と「言語」の両方がずれる。両方を合わせる必要がある。
          #
          # ＜CurrentCulture（書式）＞
          #   期待 : <DATE> 0:00:00        実測 : 4/24/1977 12:00:00 AM
          #   CompareResult.ps1 の <DATE> は \d{4}/\d{1,2}/\d{1,2} で、
          #   1977/4/24 の形にしか一致しない。
          #
          # ＜CurrentUICulture（言語）＞
          #   ・GetMessage はカルチャでファイルを選び分ける
          #     （MSGDefinition.xml → MSGDefinition_ja.xml）。
          #     判定は Thread.CurrentThread.CurrentUICulture（GetMessage.cs)。
          #   ・暗号系の例外文字列は Windows が返すため、表示言語に従う。
          #       期待 : キーがありません。   実測 : Key does not exist.
          #   どちらも Set-Culture では変わらない。言語パックの導入が要る。
          Set-Culture ja-JP

          try
          {
              Install-Language -Language ja-JP -ErrorAction Stop | Out-Null
              Set-WinUILanguageOverride -Language ja-JP
              Write-Host "日本語の言語パックを導入しました。"
          }
          catch
          {
              # 失敗しても止めない。テスト側の差分で影響範囲が分かる方が有益なため。
              Write-Host ("言語パックを導入できませんでした : {0}" -f $_.Exception.Message)
          }

          # Set-Culture / Set-WinUILanguageOverride はレジストリを書き換えるため、
          # 現在のセッションには反映されない。子プロセスで確認する。
          $c = & powershell -NoProfile -Command "(Get-Culture).Name + ' / ' + (Get-UICulture).Name"
          Write-Host ("新しいプロセスの Culture / UICulture : {0}" -f $c)

      - name: Run all tests
        shell: pwsh
        working-directory: root/programs
        run: .\2_RunAllTests.ps1 -OutputDir "${{ runner.temp }}\TestResults"

      # 失敗時こそ中身を見たいので、常に採取する。
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: ${{ runner.temp }}\BuildLogs
          if-no-files-found: warn

      # 期待値（HEAD 版）・ビルド ログ・再生成された実測値をまとめて採取する。
      # 差分が出たときは、この 2 つを突き合わせて原因を切り分ける。
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ runner.temp }}\TestResults
            root/programs/CS/Frameworks/Tests/**/Result*.txt
          if-no-files-found: warn
