# 受けブランチ（deps）に入った変更を windows-latest で検証する。
#
# ＜位置づけ＞
#   リリース時の検証 3 本（RELEASE.md 3 節）を、そのまま順に実行する。
#     1_BuildAll.ps1    全ビルド
#     2_RunAllTests.ps1 単体テスト
#     3_SmokeTest.ps1   サンプルの疎通
#   「何をビルドするか」の正はバッチ側、「合否の判定」の正は各 .ps1 にある。
#   ここには判定を書かない（書くと二重管理になる）。
#   順序も入れ替えない（1 のクリーンとアセンブリ配置が 2・3 の前提になる）。
#
#   続けて、Linux のジョブ（linux）が、net10.0 の出力を ubuntu-latest で回す
#   （2_RunAllTests.ps1 -Linux と同じ対象。#703）。
#
# ＜対象外＞
#   ・GUI アプリケーション（WinForms / WPF / 各ツールの画面）… RELEASE.md 4 節の手作業
#   ・SQL Server 以外の DBMS への接続 … 自動テストは /Dap SQL のみを使う
#     （TestSQLUtility は 4 DBMS の SQL 生成を検証するが、接続はしない）
#
# ＜署名エラーを除外している理由＞
#   WSClientWinCone_sample.csproj は ClickOnce の署名が有効で、証明書を拇印で指定し、
#   同梱の .pfx はパスワード保護されている。実行のたびに作り直される CI では用意できない。
#
#   ローカルと CI で出るコードが違うことに注意する。
#     ローカル : MSB3482（マニフェストの署名で失敗）
#              … .pfx が既にキー コンテナへ取り込まれており、最後の署名まで進むため
#     CI       : MSB3325 / MSB3321（キー ファイルの取り込みで失敗）
#              … ResolveKeySource が .pfx を取り込めず、署名に到達しないため
#
#   このため 3 つのコードを対象にし、さらに当該プロジェクトに限定する。
#   除外した内容はログに一覧されるので、握り潰しにはならない。

# Linux のジョブ（#703）を足したので、名前は「Build and test」にした。
# ファイル名は変えない（必須のチェックはジョブ名の build、文書の参照・実行の履歴を壊さないため）。
name: Build and test

on:
  push:
    branches: [deps]
  # master 宛の PR ではリリースの関所として動かす。
  #
  #   ・master へのマージは develop からのリリース時だけで、往復しない。
  #     1 回あたり 10 分前後の待ちは受け入れられる。
  #   ・RELEASE.md フェーズ 1 の「検証 3 本」を機械的に担保する。
  #
  # develop は対象にしない。deps ⇔ develop ⇔ feature と往復が多く、
  # 毎回のマージが CI 待ちになる。deps 由来の変更は deps で検証済みでもある。
  pull_request:
    branches: [master]
  workflow_dispatch:
  # 依存パッケージの脆弱性に、PR が無い間も気付くため（#681。下の「Check vulnerable packages」）。
  # 毎週月曜 09:00 JST（00:00 UTC）。schedule は既定のブランチ（develop）の版で動く。
  # 見つけたら、この実行は落ちる（失敗の通知で気付く）。通しも回るので、develop の健康診断を兼ねる。
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # ローカルの実測はビルド 5.8 分＋テスト 1.3 分。DB の導入と初期化を足して余裕を持たせる。
    timeout-minutes: 120

    env:
      # SQL Server を導入するときの sa のパスワード（Set up Northwind で SA_PASSWORD に変える）。
      INITIAL_SA_PASSWORD: 'YourStrong!Passw0rd'
      # テストとサンプルの構成ファイルに直書きされている値。
      #   Data Source=localhost;Initial Catalog=Northwind;User ID=sa;Password=seigi@123;Encrypt=false;
      # 構成側を CI 用に書き換えると「実際に使われる設定」と乖離するため、DB 側を合わせる。
      SA_PASSWORD: 'seigi@123'
      # LocalServicesOnDocker の docker-compose.yml が指定する照合順序と同じ。
      COLLATION: 'Japanese_CI_AS'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1_BuildAll.ps1 は git を使わないため、既定の浅い clone のままでよい。
      # 2_RunAllTests.ps1 は git show HEAD: で期待値を取るが、これも浅い clone で足りる。
      - name: Build all
        shell: pwsh
        working-directory: root/programs
        run: .\1_BuildAll.ps1 -OutputDir "${{ runner.temp }}\BuildLogs" -IgnoreErrors 'error MSB(3482|3325|3321):.*WSClientWinCone_sample\.csproj'

      # ------------------------------------------------------------------
      # 依存パッケージの脆弱性（#681。AGENTS.md「依存パッケージの脆弱性を見つけたら」）
      # ------------------------------------------------------------------
      # ビルドの後に回す（restore の結果を読み、推移的な依存まで見る。packages.config の net48 も見る）。
      # 判定の正は CheckVulnerability.ps1 にある。ここでは結果の扱いだけを決める。
      #   ・deps への push・master 宛の PR … 警告（::warning:: とジョブのまとめ）に留める。
      #     依存側の公表だけで、リリースの PR を止めないため
      #   ・schedule・手動 … 最後の「Fail on vulnerable packages」で落とす（失敗の通知で気付く）
      # どちらでも、後続の単体テスト・疎通は最後まで回す。
      # 脆弱性データを取れなかった（終了コード 2）ときも、見つけたときと同じに扱う（確かめられていないため）。
      # **run: の中は ASCII だけにする**（Windows PowerShell 5.1 が BOM 無しの一時ファイルを Shift_JIS で読むため。CODING.md 5 節）。
      - name: Check vulnerable packages
        id: vuln
        shell: powershell
        working-directory: root/files/tools/PowerShell/Verify
        run: |
          $out = & .\CheckVulnerability.ps1 -Check -Detail *>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          "## Vulnerable packages (CheckVulnerability.ps1, exit $code)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0)
          {
            Write-Host "::warning::Vulnerable packages were found, or the vulnerability data could not be fetched (exit $code). See the job summary. Fix them on the spot (AGENTS.md)."
            "found=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          }
          exit 0

      # ------------------------------------------------------------------
      # 単体テストのための SQL Server
      # ------------------------------------------------------------------
      # LocalServicesOnDocker の docker-compose はそのままでは使えない。
      # sqlserver サービスが Linux イメージ（mcr.microsoft.com/mssql/server）で、
      # windows-latest は Linux コンテナを動かせないため（多段のネストができない）。
      # 代わりに runner へ直接 SQL Server を入れ、同リポジトリの instnwnd.sql だけを使う。
      #
      # Developer の ISO を直接取り、ハッシュを確かめてから導入する。
      # 以前は ankane/setup-sqlserver を使っていたが、その中の SSEI（ブートストラッパ）の
      # /Action=Download が、2026-10 から何も出さずに止まるようになった（20 分で打ち切り）。
      - name: Install SQL Server
        # 取得が止まると、打ち切られずにジョブ全体の timeout-minutes（120）まで待ち続けるため、ここで切る。
        timeout-minutes: 20
        shell: pwsh
        env:
          # SQL Server 2022 Developer（英語版、約 1.1 GB）。URL とハッシュは Chocolatey の sql-server-2022 パッケージと同じ。
          SQLSERVER_ISO_URL: https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso
          SQLSERVER_ISO_SHA256: 80D2CD75DD2B28098C0182F50AD86BD44F9B3A9F357C30FF617480A1497DAFFD
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'SQLServer2022-x64-ENU-Dev.iso'

          # 60 秒間 1 MB/s を下回ったら打ち切り、取り直す。
          & curl.exe -fL --retry 3 --retry-all-errors --connect-timeout 30 --speed-limit 1048576 --speed-time 60 -o $iso $env:SQLSERVER_ISO_URL
          if ($LASTEXITCODE -ne 0) { throw "ISO を取得できない（curl の終了コード $LASTEXITCODE）" }

          $hash = (Get-FileHash -Path $iso -Algorithm SHA256).Hash
          if ($hash -ne $env:SQLSERVER_ISO_SHA256) { throw "ISO のハッシュが違う（$hash）" }

          # 引数は ankane/setup-sqlserver が渡していたものと同じ。
          $drive = (Mount-DiskImage -ImagePath $iso -PassThru | Get-Volume).DriveLetter
          $setupArgs = @(
              '/Q', '/IACCEPTSQLSERVERLICENSETERMS', '/ACTION="install"',
              '/FEATURES=SQL,Tools', '/INSTANCENAME=MSSQLSERVER',
              '/SQLSVCACCOUNT="NT AUTHORITY\SYSTEM"', '/SQLSYSADMINACCOUNTS="BUILTIN\ADMINISTRATORS"',
              "/SAPWD=`"$env:INITIAL_SA_PASSWORD`"", '/SECURITYMODE=SQL', '/ERRORREPORTING=0'
          )
          $p = Start-Process -FilePath "${drive}:\setup.exe" -ArgumentList $setupArgs -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -notin 0, 3010)
          {
              Get-Content 'C:\Program Files\Microsoft SQL Server\160\Setup Bootstrap\Log\Summary.txt' -ErrorAction SilentlyContinue
              throw "SQL Server を導入できない（setup.exe の終了コード $($p.ExitCode)）"
          }
          Dismount-DiskImage -ImagePath $iso | Out-Null
          Remove-Item -Path $iso

          # sqlcmd を後続のステップの PATH に足す（ankane/setup-sqlserver と同じ場所）。
          'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\170\Tools\Binn' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Set up Northwind
        shell: pwsh
        env:
          # LocalServicesOnDocker のコミットに固定する。
          # 中身は Microsoft 公式の Northwind DDL（約 1 MB）。
          NORTHWIND_URL: https://raw.githubusercontent.com/NetDevInfraWGinOSSConsortium/LocalServicesOnDocker/90763cd5f2aa681b1172d9277a2b133514fdaebe/sqlserver/init/instnwnd.sql
        run: |
          $ErrorActionPreference = 'Stop'

          # sqlcmd 18 以降は既定で暗号化するため -C（サーバー証明書を信頼）が要る。
          # 旧版は -C を解釈しないので、使えるかどうかを一度だけ判定する。
          $cflag = @()
          & sqlcmd -S localhost -U sa -P $env:INITIAL_SA_PASSWORD -C -Q "SELECT 1" *> $null
          if ($LASTEXITCODE -eq 0) { $cflag = @('-C') }

          function Invoke-Sql
          {
              param([string]$Password, [string]$Database, [string]$Query, [string]$File, [switch]$Raw)

              $a = @('-S', 'localhost', '-U', 'sa', '-P', $Password, '-b') + $cflag
              if ($Database) { $a += @('-d', $Database) }
              if ($Raw)      { $a += @('-h', '-1', '-W') }
              if ($Query)    { $a += @('-Q', $Query) }
              if ($File)     { $a += @('-i', $File) }
              & sqlcmd @a
          }

          # 構成ファイルに合わせてパスワードを変更する。
          Write-Host "sa のパスワードを構成ファイルに合わせます。"
          Invoke-Sql -Password $env:INITIAL_SA_PASSWORD -Query "ALTER LOGIN sa WITH PASSWORD = '$($env:SA_PASSWORD)'"
          if ($LASTEXITCODE -ne 0) { throw "sa のパスワードを変更できませんでした。" }

          $sql = Join-Path $env:RUNNER_TEMP 'instnwnd.sql'
          Invoke-WebRequest -Uri $env:NORTHWIND_URL -OutFile $sql
          Write-Host ("instnwnd.sql を取得しました（{0:N0} バイト）。" -f (Get-Item $sql).Length)

          # instnwnd.sql は DB を作らない（対象 DB の中で実行する）ため、先に CREATE する。
          # 照合順序は DB 既定として与える。Northwind の列は COLLATE 句を持たないので、
          # 各列がこれを継承する。
          #
          # 起動直後は一部のバッチが失敗して不完全なロードになることがあるため
          # （表だけできてデータが入らない等）、Shippers が 3 行あるかで検証して再試行する。
          # 判定方法は LocalServicesOnDocker の start-up.sh に合わせている。
          $loaded = $false

          foreach ($attempt in 1..3)
          {
              Write-Host "Northwind をロードします（$attempt 回目）。"

              # ヒアストリングは使わない。YAML のブロック スカラーはインデントを
              # 剥がすため、終端の "@ を行頭に置く必要があり、桁が衝突する。
              $drop   = "IF DB_ID('Northwind') IS NOT NULL BEGIN ALTER DATABASE Northwind SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE Northwind; END;"
              $create = "CREATE DATABASE Northwind COLLATE $($env:COLLATION);"

              Invoke-Sql -Password $env:SA_PASSWORD -Query "$drop $create"
              Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -File $sql *> $null

              $n = (Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -Raw `
                    -Query "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Shippers") -join ''
              if ($n.Trim() -eq '3') { $loaded = $true; break }

              Write-Host "  ロードが不完全です。再試行します。"
          }

          if (-not $loaded) { throw "Northwind のロードが完了しませんでした。" }

          # Northwind 標準には無い表。3_SmokeTest.ps1 の RerunnableBatch 系が使う。
          # （Orders 830 件を読んで Orders2 へ INSERT する。空にするのはスクリプト側の役目）
          #
          # 3_SmokeTest.ps1 も無ければ作るため、ここは無くても通る。
          # それでも流しておくのは、DB の準備をこのステップに閉じるため
          # （疎通確認より前に、表が揃っていることを確かめられる）。
          # なお sqlcmd は GO をそのまま解釈できる。SqlClient で流すスクリプト側は
          # 自前で分割している。
          $orders2 = 'root/programs/CS/Samples/Bat_sample/RerunnableBatch_sample/CREATE ORDERS2.sql'
          Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -File $orders2 *> $null

          # 初期状態の確認（RELEASE.md 2 節と同じ観点）。
          $orders = (Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -Raw `
                     -Query "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Orders") -join ''
          Write-Host ("Northwind 準備完了 : Shippers=3  Orders={0}" -f $orders.Trim())

      # ------------------------------------------------------------------
      # テストが前提とする環境（C:\root と日本語ロケール）
      # ------------------------------------------------------------------
      - name: Set up C:\root and locale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 構成ファイルが C:\root\files\... を絶対パスで参照している。
          #   TestCode/App.config    FxXMLMSGDefinition / FxXMLSPDefinition
          #   SimpleBatch/app.config SqlTextFilePath
          # 無いと GetMessage が空を返し、SimpleBatch は
          #   resource file [...] was not found
          # で失敗する。コピーではなくジャンクションにして、実体を 1 つに保つ。
          if (-not (Test-Path 'C:\root'))
          {
              New-Item -ItemType Junction -Path 'C:\root' `
                       -Target (Join-Path $env:GITHUB_WORKSPACE 'root') | Out-Null
          }

          foreach ($p in @('C:\root\files\resource\Sql',
                           'C:\root\files\resource\Xml\MSGDefinition.xml',
                           'C:\root\files\resource\Xml\SPDefinition.xml'))
          {
              if (-not (Test-Path $p)) { throw "$p が見つかりません。" }
          }
          Write-Host "C:\root を配置しました。"

          # 期待値は日本語環境で生成されている。runner の既定は en-US で、
          # 「書式」と「言語」の両方がずれる。両方を合わせる必要がある。
          #
          # ＜CurrentCulture（書式）＞
          #   期待 : <DATE> 0:00:00        実測 : 4/24/1977 12:00:00 AM
          #   CompareResult.ps1 の <DATE> は \d{4}/\d{1,2}/\d{1,2} で、
          #   1977/4/24 の形にしか一致しない。
          #
          # ＜CurrentUICulture（言語）＞
          #   ここでは直せない。試して駄目だったものは BUILDING.md 9 節に記録した。
          #     Install-Language              … ハング（run 30976630947）
          #     Set-WinUILanguageOverride     … 言語パックの導入が前提
          #     PreferredUILanguages を直書き … 未インストールの言語は無視される
          #   言語に依存する 2 か所は、リポジトリ側で処理している。
          #     GetMessage    … TestCode の構成に FxBusinessMessageCulture=ja-JP を指定
          #     OS のメッセージ … CompareResult.ps1 で <OSMSG> に正規化
          Set-Culture ja-JP

          # Set-Culture はレジストリを書き換えるだけで、現在のセッションには反映されない。
          # 効いたかどうかを子プロセスで確認する（UICulture は en-US のままが正常）。
          $c = & powershell -NoProfile -Command "(Get-Culture).Name + ' / ' + (Get-UICulture).Name"
          Write-Host ("新しいプロセスの Culture / UICulture : {0}" -f $c)

      - name: Run all tests
        shell: pwsh
        working-directory: root/programs
        run: .\2_RunAllTests.ps1 -OutputDir "${{ runner.temp }}\TestResults"

      # Linux のジョブ（下の linux）へ、net10.0 の出力を渡す（#703）。
      # 2_RunAllTests.ps1 -Linux がコンテナで回しているものと同じ 2 つ（EncAndDecUtilCUI・TestPublic）。
      # テストが NG でも渡す（Linux の回は、Windows の回とは別に結果を出す）。
      - name: Upload net10.0 output for Linux
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-input
          path: |
            root/programs/CS/Frameworks/Tests/Golden/EncAndDecUtilCUI/core100/bin/Debug/net10.0/
            root/programs/CS/Frameworks/Tests/NUnit/TestPublic/bin/Debug/net10.0/
          if-no-files-found: error
          retention-days: 1

      # ------------------------------------------------------------------
      # 疎通（3_SmokeTest.ps1）
      # ------------------------------------------------------------------
      # 3_SmokeTest.ps1 はサービスの開始を自分では行わない。システムの状態を変える
      # 操作だからで、足りない場合は対処方法を示して NG にする（AGENTS.md の線引き）。
      # runner は使い捨てで、この判断が当てはまらないため、ここで開始する。
      - name: Start aspnet_state
        shell: pwsh
        run: |
          Start-Service aspnet_state
          Write-Host ("aspnet_state : {0}" -f (Get-Service aspnet_state).Status)

      # IIS Express は windows-latest（win25-vs2026）に同梱されている。
      #   C:\Program Files\IIS Express\iisexpress.exe  v10.0.26013.1000
      # 3_SmokeTest.ps1 が見るのも %ProgramFiles% 側なので、そのまま使える。
      #
      # -IncludeUIA : UI を実際に操作する対象も回す（#588）。
      #   手元ではデスクトップを占有して人の作業と衝突するため、既定で外れている。
      #   ランナーは使い捨てで衝突する相手が居ないので、ここでは回す。
      - name: Smoke test
        shell: pwsh
        working-directory: root/programs
        run: .\3_SmokeTest.ps1 -IncludeUIA -OutputDir "${{ runner.temp }}\SmokeTest"

      # 失敗時こそ中身を見たいので、常に採取する。
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: ${{ runner.temp }}\BuildLogs
          if-no-files-found: warn

      # 期待値（HEAD 版）・ビルド ログ・再生成された実測値をまとめて採取する。
      # 差分が出たときは、この 2 つを突き合わせて原因を切り分ける。
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ runner.temp }}\TestResults
            root/programs/CS/Frameworks/Tests/**/Result*.txt
            root/programs/CS/Frameworks/Tests/NUnit/TestResults/**
          if-no-files-found: warn

      # 疎通は期待結果ファイルを持たないため、判定は各対象の標準出力に残る。
      # Web 系は IIS Express の起動ログもここに入る。
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: ${{ runner.temp }}\SmokeTest
          if-no-files-found: warn

      # 週 1 回・手動の実行だけ、脆弱性で落とす（上の「Check vulnerable packages」）。
      # 採取の後に置く（落としても、ログと結果は残す）。
      - name: Fail on vulnerable packages (schedule / manual)
        if: always() && steps.vuln.outputs.found == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: powershell
        run: |
          Write-Host "::error::Vulnerable packages were found (or could not be checked). See the 'Check vulnerable packages' step and the job summary."
          exit 1

  # --------------------------------------------------------------------
  # Linux（#703）
  # --------------------------------------------------------------------
  # Windows でビルドした net10.0 の出力を、Linux のランナーでそのまま回す。
  # 手元の 2_RunAllTests.ps1 -Linux が、Linux のコンテナで回しているものと同じ。
  # windows-latest は Linux のコンテナを動かせないため、ランナーを分ける。
  # 判定は 2_RunAllTests.ps1 が行う（Linux の上で -Linux を付けると、docker を使わずに直接回す）。
  #
  # ビルドの出力は同じ実行の中でしか渡せないので、別のファイルにせず、このワークフローに置く。
  linux:
    needs: build
    # Windows の回が NG でも回す（出力が渡っていなければ、受け取りで落ちる）
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 上の「Upload net10.0 output for Linux」が、Tests の下の相対パスで置いたもの
      - name: Download net10.0 output
        uses: actions/download-artifact@v8
        with:
          name: linux-input
          path: root/programs/CS/Frameworks/Tests

      - name: Run tests on Linux
        shell: pwsh
        working-directory: root/programs
        run: ./2_RunAllTests.ps1 -Linux -OutputDir "${{ runner.temp }}/TestResults"

      - name: Upload test results (Linux)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: |
            ${{ runner.temp }}/TestResults
            root/programs/CS/Frameworks/Tests/Golden/EncAndDecUtilCUI/ResultCore100OnLinux.txt
            root/programs/CS/Frameworks/Tests/NUnit/TestResults/Linux/**
          if-no-files-found: warn
