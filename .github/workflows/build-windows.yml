# 受けブランチ（deps）に入った変更を windows-latest で検証する。
#
# ＜位置づけ＞
#   リリース時の検証 3 本（RELEASE.md 3 節）を、そのまま順に実行する。
#     1_BuildAll.ps1    全ビルド
#     2_RunAllTests.ps1 単体テスト
#     3_SmokeTest.ps1   サンプルの疎通
#   「何をビルドするか」の正はバッチ側、「合否の判定」の正は各 .ps1 にある。
#   ここには判定を書かない（書くと二重管理になる）。
#   順序も入れ替えない（1 のクリーンとアセンブリ配置が 2・3 の前提になる）。
#
#   続けて、Linux のジョブ（linux）が、net10.0 の出力を ubuntu-latest で回す
#   （2_RunAllTests.ps1 -Linux と同じ対象。#703）。
#   クロス DB のジョブ（linux-crossdb）が、TestPublicDb の net10.0 を Oracle・MySQL・PostgreSQL で回す
#   （2_RunAllTests.ps1 -CrossDb の net10.0 の分。#703）。
#   認証の E2E のジョブ（linux-kck・linux-stub）が、SpRp のサンプルの E2E（Sample4SpRp\E2E）の net10.0 を、IdP（STS）を Keycloak・MPAS のスタブにして回す（#703）。
#
# ＜対象外＞
#   ・GUI アプリケーション（WinForms / WPF / 各ツールの画面）… RELEASE.md 4 節の手作業
#   ・SpRp の E2E の net48・WebForms … 手元で回す（Windows とコンテナが同じ機械に要る）
#   ・Golden の TestDataAccess のクロス DB … 手元で回す（build は /Dap SQL のみを使う。TestSQLUtility は 4 DBMS の SQL 生成を検証するが、接続はしない）
#   ・net48 の NUnit TestPublicDb のクロス DB は、win-crossdb（Windows ランナー＋WSL2 の Docker。#712）が回す
#
# ＜署名エラーを除外している理由＞
#   WSClientWinCone_sample.csproj は ClickOnce の署名が有効で、証明書を拇印で指定し、
#   同梱の .pfx はパスワード保護されている。実行のたびに作り直される CI では用意できない。
#
#   ローカルと CI で出るコードが違うことに注意する。
#     ローカル : MSB3482（マニフェストの署名で失敗）
#              … .pfx が既にキー コンテナへ取り込まれており、最後の署名まで進むため
#     CI       : MSB3325 / MSB3321（キー ファイルの取り込みで失敗）
#              … ResolveKeySource が .pfx を取り込めず、署名に到達しないため
#
#   このため 3 つのコードを対象にし、さらに当該プロジェクトに限定する。
#   除外した内容はログに一覧されるので、握り潰しにはならない。

# Linux のジョブ（#703）を足したので、名前は「Build and test」にした。
# ファイル名は変えない（必須のチェックはジョブ名の build、文書の参照・実行の履歴を壊さないため）。
name: Build and test

on:
  push:
    branches: [deps]
  # master 宛の PR ではリリースの関所として動かす。
  #
  #   ・master へのマージは develop からのリリース時だけで、往復しない。
  #     1 回あたり 10 分前後の待ちは受け入れられる。
  #   ・RELEASE.md フェーズ 1 の「検証 3 本」を機械的に担保する。
  #
  # develop は対象にしない。deps ⇔ develop ⇔ feature と往復が多く、
  # 毎回のマージが CI 待ちになる。deps 由来の変更は deps で検証済みでもある。
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      probe_win_sts:
        description: '#712 の実験（Windows ランナーで IIS Express と WSL2 の Keycloak）だけを回す（一時。実験が終わったら外す）'
        type: boolean
        default: false
  # 依存パッケージの脆弱性に、PR が無い間も気付くため（#681。下の「Check vulnerable packages」）。
  # 毎週月曜 09:00 JST（00:00 UTC）。schedule は既定のブランチ（develop）の版で動く。
  # 見つけたら、この実行は落ちる（失敗の通知で気付く）。通しも回るので、develop の健康診断を兼ねる。
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.probe_win_sts }}
    runs-on: windows-latest
    # ローカルの実測はビルド 5.8 分＋テスト 1.3 分。DB の導入と初期化を足して余裕を持たせる。
    timeout-minutes: 120

    env:
      # SQL Server を導入するときの sa のパスワード（Set up Northwind で SA_PASSWORD に変える）。
      INITIAL_SA_PASSWORD: 'YourStrong!Passw0rd'
      # テストとサンプルの構成ファイルに直書きされている値。
      #   Data Source=localhost;Initial Catalog=Northwind;User ID=sa;Password=seigi@123;Encrypt=false;
      # 構成側を CI 用に書き換えると「実際に使われる設定」と乖離するため、DB 側を合わせる。
      SA_PASSWORD: 'seigi@123'
      # LocalServicesOnDocker の docker-compose.yml が指定する照合順序と同じ。
      COLLATION: 'Japanese_CI_AS'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1_BuildAll.ps1 は git を使わないため、既定の浅い clone のままでよい。
      # 2_RunAllTests.ps1 は git show HEAD: で期待値を取るが、これも浅い clone で足りる。
      - name: Build all
        shell: pwsh
        working-directory: root/programs
        run: .\1_BuildAll.ps1 -OutputDir "${{ runner.temp }}\BuildLogs" -IgnoreErrors 'error MSB(3482|3325|3321):.*WSClientWinCone_sample\.csproj'

      # ------------------------------------------------------------------
      # 依存パッケージの脆弱性（#681。AGENTS.md「依存パッケージの脆弱性を見つけたら」）
      # ------------------------------------------------------------------
      # ビルドの後に回す（restore の結果を読み、推移的な依存まで見る。packages.config の net48 も見る）。
      # 判定の正は CheckVulnerability.ps1 にある。ここでは結果の扱いだけを決める。
      #   ・deps への push・master 宛の PR … 警告（::warning:: とジョブのまとめ）に留める。
      #     依存側の公表だけで、リリースの PR を止めないため
      #   ・schedule・手動 … 最後の「Fail on vulnerable packages」で落とす（失敗の通知で気付く）
      # どちらでも、後続の単体テスト・疎通は最後まで回す。
      # 脆弱性データを取れなかった（終了コード 2）ときも、見つけたときと同じに扱う（確かめられていないため）。
      # **run: の中は ASCII だけにする**（Windows PowerShell 5.1 が BOM 無しの一時ファイルを Shift_JIS で読むため。CODING.md 5 節）。
      - name: Check vulnerable packages
        id: vuln
        shell: powershell
        working-directory: root/files/tools/PowerShell/Verify
        run: |
          $out = & .\CheckVulnerability.ps1 -Check -Detail *>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          "## Vulnerable packages (CheckVulnerability.ps1, exit $code)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0)
          {
            Write-Host "::warning::Vulnerable packages were found, or the vulnerability data could not be fetched (exit $code). See the job summary. Fix them on the spot (AGENTS.md)."
            "found=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          }
          exit 0

      # ------------------------------------------------------------------
      # 単体テストのための SQL Server
      # ------------------------------------------------------------------
      # LocalServicesOnDocker の docker-compose はそのままでは使えない。
      # sqlserver サービスが Linux イメージ（mcr.microsoft.com/mssql/server）で、
      # windows-latest は Windows コンテナ用の docker だけを持つため（Linux コンテナは WSL2 経由なら動くと、#711 で分かった。build は、このまま直接入れる。net48 のクロス DB は win-crossdb が WSL2 で回す）。
      # 代わりに runner へ直接 SQL Server を入れ、同リポジトリの instnwnd.sql だけを使う。
      #
      # Developer の ISO を直接取り、ハッシュを確かめてから導入する。
      # 以前は ankane/setup-sqlserver を使っていたが、その中の SSEI（ブートストラッパ）の
      # /Action=Download が、2026-10 から何も出さずに止まるようになった（20 分で打ち切り）。
      - name: Install SQL Server
        # 取得が止まると、打ち切られずにジョブ全体の timeout-minutes（120）まで待ち続けるため、ここで切る。
        timeout-minutes: 20
        shell: pwsh
        env:
          # SQL Server 2022 Developer（英語版、約 1.1 GB）。URL とハッシュは Chocolatey の sql-server-2022 パッケージと同じ。
          SQLSERVER_ISO_URL: https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso
          SQLSERVER_ISO_SHA256: 80D2CD75DD2B28098C0182F50AD86BD44F9B3A9F357C30FF617480A1497DAFFD
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'SQLServer2022-x64-ENU-Dev.iso'

          # 60 秒間 1 MB/s を下回ったら打ち切り、取り直す。
          & curl.exe -fL --retry 3 --retry-all-errors --connect-timeout 30 --speed-limit 1048576 --speed-time 60 -o $iso $env:SQLSERVER_ISO_URL
          if ($LASTEXITCODE -ne 0) { throw "ISO を取得できない（curl の終了コード $LASTEXITCODE）" }

          $hash = (Get-FileHash -Path $iso -Algorithm SHA256).Hash
          if ($hash -ne $env:SQLSERVER_ISO_SHA256) { throw "ISO のハッシュが違う（$hash）" }

          # 引数は ankane/setup-sqlserver が渡していたものと同じ。
          $drive = (Mount-DiskImage -ImagePath $iso -PassThru | Get-Volume).DriveLetter
          $setupArgs = @(
              '/Q', '/IACCEPTSQLSERVERLICENSETERMS', '/ACTION="install"',
              '/FEATURES=SQL,Tools', '/INSTANCENAME=MSSQLSERVER',
              '/SQLSVCACCOUNT="NT AUTHORITY\SYSTEM"', '/SQLSYSADMINACCOUNTS="BUILTIN\ADMINISTRATORS"',
              "/SAPWD=`"$env:INITIAL_SA_PASSWORD`"", '/SECURITYMODE=SQL', '/ERRORREPORTING=0'
          )
          $p = Start-Process -FilePath "${drive}:\setup.exe" -ArgumentList $setupArgs -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -notin 0, 3010)
          {
              Get-Content 'C:\Program Files\Microsoft SQL Server\160\Setup Bootstrap\Log\Summary.txt' -ErrorAction SilentlyContinue
              throw "SQL Server を導入できない（setup.exe の終了コード $($p.ExitCode)）"
          }
          Dismount-DiskImage -ImagePath $iso | Out-Null
          Remove-Item -Path $iso

          # sqlcmd を後続のステップの PATH に足す（ankane/setup-sqlserver と同じ場所）。
          'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\170\Tools\Binn' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Set up Northwind
        shell: pwsh
        env:
          # LocalServicesOnDocker のコミットに固定する。
          # 中身は Microsoft 公式の Northwind DDL（約 1 MB）。
          NORTHWIND_URL: https://raw.githubusercontent.com/NetDevInfraWGinOSSConsortium/LocalServicesOnDocker/90763cd5f2aa681b1172d9277a2b133514fdaebe/sqlserver/init/instnwnd.sql
        run: |
          $ErrorActionPreference = 'Stop'

          # sqlcmd 18 以降は既定で暗号化するため -C（サーバー証明書を信頼）が要る。
          # 旧版は -C を解釈しないので、使えるかどうかを一度だけ判定する。
          $cflag = @()
          & sqlcmd -S localhost -U sa -P $env:INITIAL_SA_PASSWORD -C -Q "SELECT 1" *> $null
          if ($LASTEXITCODE -eq 0) { $cflag = @('-C') }

          function Invoke-Sql
          {
              param([string]$Password, [string]$Database, [string]$Query, [string]$File, [switch]$Raw)

              $a = @('-S', 'localhost', '-U', 'sa', '-P', $Password, '-b') + $cflag
              if ($Database) { $a += @('-d', $Database) }
              if ($Raw)      { $a += @('-h', '-1', '-W') }
              if ($Query)    { $a += @('-Q', $Query) }
              if ($File)     { $a += @('-i', $File) }
              & sqlcmd @a
          }

          # 構成ファイルに合わせてパスワードを変更する。
          Write-Host "sa のパスワードを構成ファイルに合わせます。"
          Invoke-Sql -Password $env:INITIAL_SA_PASSWORD -Query "ALTER LOGIN sa WITH PASSWORD = '$($env:SA_PASSWORD)'"
          if ($LASTEXITCODE -ne 0) { throw "sa のパスワードを変更できませんでした。" }

          $sql = Join-Path $env:RUNNER_TEMP 'instnwnd.sql'
          Invoke-WebRequest -Uri $env:NORTHWIND_URL -OutFile $sql
          Write-Host ("instnwnd.sql を取得しました（{0:N0} バイト）。" -f (Get-Item $sql).Length)

          # instnwnd.sql は DB を作らない（対象 DB の中で実行する）ため、先に CREATE する。
          # 照合順序は DB 既定として与える。Northwind の列は COLLATE 句を持たないので、
          # 各列がこれを継承する。
          #
          # 起動直後は一部のバッチが失敗して不完全なロードになることがあるため
          # （表だけできてデータが入らない等）、Shippers が 3 行あるかで検証して再試行する。
          # 判定方法は LocalServicesOnDocker の start-up.sh に合わせている。
          $loaded = $false

          foreach ($attempt in 1..3)
          {
              Write-Host "Northwind をロードします（$attempt 回目）。"

              # ヒアストリングは使わない。YAML のブロック スカラーはインデントを
              # 剥がすため、終端の "@ を行頭に置く必要があり、桁が衝突する。
              $drop   = "IF DB_ID('Northwind') IS NOT NULL BEGIN ALTER DATABASE Northwind SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE Northwind; END;"
              $create = "CREATE DATABASE Northwind COLLATE $($env:COLLATION);"

              Invoke-Sql -Password $env:SA_PASSWORD -Query "$drop $create"
              Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -File $sql *> $null

              $n = (Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -Raw `
                    -Query "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Shippers") -join ''
              if ($n.Trim() -eq '3') { $loaded = $true; break }

              Write-Host "  ロードが不完全です。再試行します。"
          }

          if (-not $loaded) { throw "Northwind のロードが完了しませんでした。" }

          # Northwind 標準には無い表。3_SmokeTest.ps1 の RerunnableBatch 系が使う。
          # （Orders 830 件を読んで Orders2 へ INSERT する。空にするのはスクリプト側の役目）
          #
          # 3_SmokeTest.ps1 も無ければ作るため、ここは無くても通る。
          # それでも流しておくのは、DB の準備をこのステップに閉じるため
          # （疎通確認より前に、表が揃っていることを確かめられる）。
          # なお sqlcmd は GO をそのまま解釈できる。SqlClient で流すスクリプト側は
          # 自前で分割している。
          $orders2 = 'root/programs/CS/Samples/Bat_sample/RerunnableBatch_sample/CREATE ORDERS2.sql'
          Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -File $orders2 *> $null

          # 初期状態の確認（RELEASE.md 2 節と同じ観点）。
          $orders = (Invoke-Sql -Password $env:SA_PASSWORD -Database Northwind -Raw `
                     -Query "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Orders") -join ''
          Write-Host ("Northwind 準備完了 : Shippers=3  Orders={0}" -f $orders.Trim())

      # ------------------------------------------------------------------
      # テストが前提とする環境（C:\root と日本語ロケール）
      # ------------------------------------------------------------------
      - name: Set up C:\root and locale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 構成ファイルが C:\root\files\... を絶対パスで参照している。
          #   TestCode/App.config    FxXMLMSGDefinition / FxXMLSPDefinition
          #   SimpleBatch/app.config SqlTextFilePath
          # 無いと GetMessage が空を返し、SimpleBatch は
          #   resource file [...] was not found
          # で失敗する。コピーではなくジャンクションにして、実体を 1 つに保つ。
          if (-not (Test-Path 'C:\root'))
          {
              New-Item -ItemType Junction -Path 'C:\root' `
                       -Target (Join-Path $env:GITHUB_WORKSPACE 'root') | Out-Null
          }

          foreach ($p in @('C:\root\files\resource\Sql',
                           'C:\root\files\resource\Xml\MSGDefinition.xml',
                           'C:\root\files\resource\Xml\SPDefinition.xml'))
          {
              if (-not (Test-Path $p)) { throw "$p が見つかりません。" }
          }
          Write-Host "C:\root を配置しました。"

          # 期待値は日本語環境で生成されている。runner の既定は en-US で、
          # 「書式」と「言語」の両方がずれる。両方を合わせる必要がある。
          #
          # ＜CurrentCulture（書式）＞
          #   期待 : <DATE> 0:00:00        実測 : 4/24/1977 12:00:00 AM
          #   CompareResult.ps1 の <DATE> は \d{4}/\d{1,2}/\d{1,2} で、
          #   1977/4/24 の形にしか一致しない。
          #
          # ＜CurrentUICulture（言語）＞
          #   ここでは直せない。試して駄目だったものは BUILDING.md 9 節に記録した。
          #     Install-Language              … ハング（run 30976630947）
          #     Set-WinUILanguageOverride     … 言語パックの導入が前提
          #     PreferredUILanguages を直書き … 未インストールの言語は無視される
          #   言語に依存する 2 か所は、リポジトリ側で処理している。
          #     GetMessage    … TestCode の構成に FxBusinessMessageCulture=ja-JP を指定
          #     OS のメッセージ … CompareResult.ps1 で <OSMSG> に正規化
          Set-Culture ja-JP

          # Set-Culture はレジストリを書き換えるだけで、現在のセッションには反映されない。
          # 効いたかどうかを子プロセスで確認する（UICulture は en-US のままが正常）。
          $c = & powershell -NoProfile -Command "(Get-Culture).Name + ' / ' + (Get-UICulture).Name"
          Write-Host ("新しいプロセスの Culture / UICulture : {0}" -f $c)

      - name: Run all tests
        shell: pwsh
        working-directory: root/programs
        run: .\2_RunAllTests.ps1 -OutputDir "${{ runner.temp }}\TestResults"

      # Linux のジョブ（下の linux・linux-crossdb）へ、net10.0 の出力を渡す（#703）。
      # 2_RunAllTests.ps1 -Linux がコンテナで回しているものと同じ 2 つ（EncAndDecUtilCUI・TestPublic）と、
      # -CrossDb が回す TestPublicDb。
      # テストが NG でも渡す（Linux の回は、Windows の回とは別に結果を出す）。
      - name: Upload net10.0 output for Linux
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-input
          path: |
            root/programs/CS/Frameworks/Tests/Golden/EncAndDecUtilCUI/core100/bin/Debug/net10.0/
            root/programs/CS/Frameworks/Tests/NUnit/TestPublic/bin/Debug/net10.0/
            root/programs/CS/Frameworks/Tests/NUnit/TestPublicDb/bin/Debug/net10.0/
          if-no-files-found: error
          retention-days: 1

      # 認証の E2E のジョブ（下の linux-kck・linux-stub）へ、SpRp の E2E が動かすサンプルの net10.0 の出力を渡す（#703 ph3）。
      # 1_BuildAll.ps1 がビルドしたもの（11_Build_SpRp_sample.bat・5_Build_CLICore_sample.bat・10_Build_WebAppCore_sample.bat）。
      - name: Upload net10.0 samples for Linux STS E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-sts-input
          path: |
            root/programs/CS/Sample4SpRp/DotNet/MVC/SpRp_MVC/bin/Debug/net10.0/
            root/programs/CS/Sample4SpRp/DotNet/CLI/SpRp_CLI/bin/Debug/net10.0/
            root/programs/CS/Samples4NetCore/Legacy/CLI_sample/DAG_Login_CLI/DAG_Login_CLI/bin/Debug/net10.0/
            root/programs/CS/Samples4NetCore/Legacy/CLI_sample/LIR_Login_CLI/LIR_Login_CLI/bin/Debug/net10.0/
            root/programs/CS/Samples4NetCore/Backend/MVC_Sample/MVC_Sample/bin/Debug/net10.0/
          if-no-files-found: error
          retention-days: 1

      # MPAS のスタブの回（linux-stub）へ、このリポジトリがビルドした部品（net10.0）を渡す。
      # MPAS は、部品を OpenTouryoAssemblies/（.gitignore）から参照する。**取ってきた MPAS をビルドするのに、いまのこのリポジトリの部品を使う**（#703）。
      - name: Upload net10.0 assemblies for the Linux stub
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-stub-input
          path: |
            root/programs/CS/Frameworks/Infrastructure/Build_netcore100/net10.0/OpenTouryo.Business.dll
            root/programs/CS/Frameworks/Infrastructure/Build_netcore100/net10.0/OpenTouryo.Framework.dll
            root/programs/CS/Frameworks/Infrastructure/Build_netcore100/net10.0/OpenTouryo.Public.dll
            root/programs/CS/Frameworks/Infrastructure/Build_netcore100/net10.0/OpenTouryo.Public.Security.dll
          if-no-files-found: error
          retention-days: 1

      # ------------------------------------------------------------------
      # 疎通（3_SmokeTest.ps1）
      # ------------------------------------------------------------------
      # 3_SmokeTest.ps1 はサービスの開始を自分では行わない。システムの状態を変える
      # 操作だからで、足りない場合は対処方法を示して NG にする（AGENTS.md の線引き）。
      # runner は使い捨てで、この判断が当てはまらないため、ここで開始する。
      - name: Start aspnet_state
        shell: pwsh
        run: |
          Start-Service aspnet_state
          Write-Host ("aspnet_state : {0}" -f (Get-Service aspnet_state).Status)

      # IIS Express は windows-latest（win25-vs2026）に同梱されている。
      #   C:\Program Files\IIS Express\iisexpress.exe  v10.0.26013.1000
      # 3_SmokeTest.ps1 が見るのも %ProgramFiles% 側なので、そのまま使える。
      #
      # -IncludeUIA : UI を実際に操作する対象も回す（#588）。
      #   手元ではデスクトップを占有して人の作業と衝突するため、既定で外れている。
      #   ランナーは使い捨てで衝突する相手が居ないので、ここでは回す。
      - name: Smoke test
        shell: pwsh
        working-directory: root/programs
        run: .\3_SmokeTest.ps1 -IncludeUIA -OutputDir "${{ runner.temp }}\SmokeTest"

      # 失敗時こそ中身を見たいので、常に採取する。
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: ${{ runner.temp }}\BuildLogs
          if-no-files-found: warn

      # 期待値（HEAD 版）・ビルド ログ・再生成された実測値をまとめて採取する。
      # 差分が出たときは、この 2 つを突き合わせて原因を切り分ける。
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ runner.temp }}\TestResults
            root/programs/CS/Frameworks/Tests/**/Result*.txt
            root/programs/CS/Frameworks/Tests/NUnit/TestResults/**
          if-no-files-found: warn

      # 疎通は期待結果ファイルを持たないため、判定は各対象の標準出力に残る。
      # Web 系は IIS Express の起動ログもここに入る。
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: ${{ runner.temp }}\SmokeTest
          if-no-files-found: warn

      # 週 1 回・手動の実行だけ、脆弱性で落とす（上の「Check vulnerable packages」）。
      # 採取の後に置く（落としても、ログと結果は残す）。
      - name: Fail on vulnerable packages (schedule / manual)
        if: always() && steps.vuln.outputs.found == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: powershell
        run: |
          Write-Host "::error::Vulnerable packages were found (or could not be checked). See the 'Check vulnerable packages' step and the job summary."
          exit 1

  # --------------------------------------------------------------------
  # Linux（#703）
  # --------------------------------------------------------------------
  # Windows でビルドした net10.0 の出力を、Linux のランナーでそのまま回す。
  # 手元の 2_RunAllTests.ps1 -Linux が、Linux のコンテナで回しているものと同じ。
  # windows-latest は Linux のコンテナを動かせないため、ランナーを分ける。
  # 判定は 2_RunAllTests.ps1 が行う（Linux の上で -Linux を付けると、docker を使わずに直接回す）。
  #
  # ビルドの出力は同じ実行の中でしか渡せないので、別のファイルにせず、このワークフローに置く。
  linux:
    needs: build
    # Windows の回が NG でも回す（出力が渡っていなければ、受け取りで落ちる）
    if: ${{ !cancelled() && !inputs.probe_win_sts }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 上の「Upload net10.0 output for Linux」が、Tests の下の相対パスで置いたもの
      - name: Download net10.0 output
        uses: actions/download-artifact@v8
        with:
          name: linux-input
          path: root/programs/CS/Frameworks/Tests

      - name: Run tests on Linux
        shell: pwsh
        working-directory: root/programs
        run: ./2_RunAllTests.ps1 -Linux -OutputDir "${{ runner.temp }}/TestResults"

      - name: Upload test results (Linux)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: |
            ${{ runner.temp }}/TestResults
            root/programs/CS/Frameworks/Tests/Golden/EncAndDecUtilCUI/ResultCore100OnLinux.txt
            root/programs/CS/Frameworks/Tests/NUnit/TestResults/Linux/**
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # クロス DB の net10.0（#703 ph2）
  # --------------------------------------------------------------------
  # TestPublicDb（net10.0）を、Oracle・MySQL・PostgreSQL で回す。手元の 2_RunAllTests.ps1 -CrossDb と同じ。
  # DB は LocalServicesOnDocker の Start-Services.ps1 で、SQL Server（必須）に 1 つずつ足して起動・停止する
  # （手元と同じ経路。起動・準備完了の待ち・停止は 2_RunAllTests.ps1 が行う）。
  # net48 は Windows とコンテナが同じ機械に要るので、ここでは回さない（win-crossdb が回す。#712）。
  #
  # ＜LocalServicesOnDocker はコミットで固定する＞
  #   向こうの変更（スクリプトの場所・初期化の SQL）が、こちらの CI に黙って届かないようにする。
  #   上げるときは、手元の -CrossDb で確かめてから LSOD_REF を変える。
  #
  # ＜回す契機＞
  #   ワークフローの契機すべて（deps への push・master 宛の PR・手動・週 1 回）。
  #   DB のドライバの更新（deps）で壊れたものを、その場で捕まえるため。
  linux-crossdb:
    needs: build
    # Windows の回が NG でも回す（出力が渡っていなければ、受け取りで落ちる）
    if: ${{ !cancelled() && !inputs.probe_win_sts }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LSOD_REPO: NetDevInfraWGinOSSConsortium/LocalServicesOnDocker
      LSOD_REF: 269e717939033e230835d0325eec255c1e03f71a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout LocalServicesOnDocker
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LSOD_REPO }}
          ref: ${{ env.LSOD_REF }}
          path: LocalServicesOnDocker
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 上の「Upload net10.0 output for Linux」が、Tests の下の相対パスで置いたもの
      - name: Download net10.0 output
        uses: actions/download-artifact@v8
        with:
          name: linux-input
          path: root/programs/CS/Frameworks/Tests

      - name: Run cross DB tests on Linux
        shell: pwsh
        working-directory: root/programs
        run: ./2_RunAllTests.ps1 -CrossDb -LocalServicesDir "${{ github.workspace }}/LocalServicesOnDocker" -OutputDir "${{ runner.temp }}/TestResults"

      - name: Upload test results (cross DB)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-crossdb
          path: |
            ${{ runner.temp }}/TestResults
            root/programs/CS/Frameworks/Tests/NUnit/TestResults/CrossDb/**
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # 認証（STS）の E2E の net10.0：IdP が Keycloak（linux-kck。#703 ph3）
  # --------------------------------------------------------------------
  # Sample4SpRp\E2E の 4 本を、IdP（STS）を Keycloak（-Idp KCK）にして回す。Linux の上では、各 E2E が net10.0 の対象だけに絞る。
  # 判定は各 E2E が行う（終了コード 0 = 全部 OK、1 = NG あり、2 = 前提が足りない）。
  # Keycloak で回らないケース（CLI の jwtbearer・FAPI2 の ros）は、MPAS のスタブの回（linux-stub）で回す。
  # **DB は使わない**（4 本とも、辿る画面は DB を読まない）。
  #
  # ＜MTLS のテスト用のクライアント証明書＞
  #   このリポジトリの root/files/resource/X509/SHA256RSAClientCert.{pfx,cer} を使う（Keycloak が信頼し、SpRp_MVC が FAPI2 の par_mtls で出す）。
  #   MPAS の現行のものと同じ（#705。以前は MPAS から取って置き換えていた）。MPAS が作り直したら、手で写す（BUILDING.md 9 節）。
  #
  # ＜HTTPS の信頼＞
  #   サンプル（Kestrel）と Keycloak は、ASP.NET Core の開発用証明書で待ち受ける（KckCompose.ps1 が書き出す）。
  #   dotnet dev-certs https --trust で信頼させ、SSL_CERT_DIR で .NET（E2E の HttpClient・サンプル）に見せる。
  #
  # ＜回す契機＞
  #   linux-crossdb と同じ（ワークフローの契機すべて。認証まわりの依存の更新を deps で捕まえるため）。
  linux-kck:
    needs: build
    # Windows の回が NG でも回す（出力が渡っていなければ、受け取りで落ちる）
    if: ${{ !cancelled() && !inputs.probe_win_sts }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 上の「Upload net10.0 samples for Linux STS E2E」が、CS の下の相対パスで置いたもの（linux-kck・linux-stub が同じ成果物を使う）
      - name: Download net10.0 samples
        uses: actions/download-artifact@v8
        with:
          name: linux-sts-input
          path: root/programs/CS

      # **終了コード 4 は「一部のクライアントでは信頼できなかった」で、ここでは止めない**。
      #   Linux の dev-certs は、OpenSSL（.NET が使う）向けに ~/.aspnet/dev-certs/trust へ置き、
      #   ブラウザ（NSS）向けの登録は、ランナーにブラウザのプロファイルが無いので失敗する（4 になる）。
      #   .NET が信頼できるかは、trust のフォルダに証明書が置かれたかで確かめる（無ければ止める）。
      - name: Trust the development certificate
        shell: bash
        run: |
          rc=0
          dotnet dev-certs https --trust || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ]; then exit "$rc"; fi
          trust="$HOME/.aspnet/dev-certs/trust"
          ls -l "$trust"
          if [ -z "$(ls -A "$trust" 2>/dev/null)" ]; then echo "::error::No certificate in $trust"; exit 1; fi
          echo "SSL_CERT_DIR=$trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Start Keycloak
        id: kck
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/container/KCK
        run: ./KckCompose.ps1

      # 4 本は、どれかが落ちても残りを回す（結果を全部見るため）
      - name: E2E FAPI 1.0 (SpRp_MVC)
        if: ${{ !cancelled() && steps.kck.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./MvcFapi1E2E.ps1 -Idp KCK -OutputDir "${{ runner.temp }}/E2E/fapi1"

      - name: E2E FAPI 2.0 (SpRp_MVC)
        if: ${{ !cancelled() && steps.kck.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./MvcFapi2E2E.ps1 -Idp KCK -Mtls -OutputDir "${{ runner.temp }}/E2E/fapi2"

      - name: E2E CLI login
        if: ${{ !cancelled() && steps.kck.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./CliLoginE2E.ps1 -Idp KCK -OutputDir "${{ runner.temp }}/E2E/cli"

      - name: E2E external login (MVC_Sample)
        if: ${{ !cancelled() && steps.kck.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./ExternalLoginE2E.ps1 -Idp KCK -Lang CS -OutputDir "${{ runner.temp }}/E2E/external"

      - name: Collect Keycloak log
        if: always()
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/E2E"
          docker compose -f root/programs/CS/Sample4SpRp/container/KCK/docker-compose.yml logs --no-color > "${{ runner.temp }}/E2E/keycloak.log" 2>&1 || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kck-logs-linux
          path: ${{ runner.temp }}/E2E
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # 認証（STS）の E2E の net10.0：IdP が MPAS のスタブ（linux-stub。#703）
  # --------------------------------------------------------------------
  # Sample4SpRp\E2E の 4 本を、IdP を MPAS のスタブ（-Idp Stub。既定）にして回す。Keycloak で回らない CLI の jwtbearer・FAPI2 の ros も、ここで回る。
  # スタブは、MPAS の container/Stub を pwsh で起動する（MultiPurposeAuthSite#401）。MPAS の場所は環境変数 OT_MPAS_PATH。
  # **DB は使わない**（スタブは組み込みのストアで動く）。
  #
  # ＜取ってくるもの（コミットで固定する。上げるときは、手元で回してから）＞
  #   ・MultiPurposeAuthSite（MPAS_REF）… スタブの publish に、ソース一式が要る。
  #     MPAS がビルドで参照する部品（OpenTouryoAssemblies/）は、build が作った、いまのこのリポジトリの net10.0 の部品を置く（linux-stub-input）
  #
  # ＜テスト用の設定＞
  #   スタブの設定の土台は、MPAS の雛形（_appsettings.json）。TestUserPWD が雛形のままの文字列なので、CI で生成した値に替えた写しを使う
  #   （STUB_APPSETTINGS と、E2E の -StubAppSettings の両方に、その写しを渡す）。値はテスト専用で、秘密ではない。
  linux-stub:
    needs: build
    # Windows の回が NG でも回す（出力が渡っていなければ、受け取りで落ちる）
    if: ${{ !cancelled() && !inputs.probe_win_sts }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPAS_REPO: OpenTouryoProject/MultiPurposeAuthSite
      MPAS_REF: 3e914592241ec10fdac35e6c5426e52d28777fe8
      STUB_TEST_USER_PWD: 'Test-User-Pwd-1!'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout MultiPurposeAuthSite
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MPAS_REPO }}
          ref: ${{ env.MPAS_REF }}
          path: MultiPurposeAuthSite
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download net10.0 samples
        uses: actions/download-artifact@v8
        with:
          name: linux-sts-input
          path: root/programs/CS

      # MPAS は、部品を OpenTouryoAssemblies/（.gitignore）から参照する。build が作った、いまのこのリポジトリの部品を置く
      - name: Download net10.0 assemblies
        uses: actions/download-artifact@v8
        with:
          name: linux-stub-input
          path: MultiPurposeAuthSite/root/programs/OpenTouryoAssemblies/Build_netcore100/net10.0

      # linux-kck と同じ（理由もそちら）。MPAS の 1_PublishStub.ps1 は、この開発用証明書を書き出す
      - name: Trust the development certificate
        shell: bash
        run: |
          rc=0
          dotnet dev-certs https --trust || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ]; then exit "$rc"; fi
          trust="$HOME/.aspnet/dev-certs/trust"
          ls -l "$trust"
          if [ -z "$(ls -A "$trust" 2>/dev/null)" ]; then echo "::error::No certificate in $trust"; exit 1; fi
          echo "SSL_CERT_DIR=$trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Publish the stub (MPAS)
        shell: pwsh
        working-directory: MultiPurposeAuthSite/container/Stub
        run: ./1_PublishStub.ps1

      # 雛形（_appsettings.json）の TestUserPWD だけを、テスト用の値に替える
      - name: Prepare the stub settings
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'MultiPurposeAuthSite/root/programs/MultiPurposeAuthSiteCore/MultiPurposeAuthSiteCore/_appsettings.json'
          $dst = Join-Path $env:RUNNER_TEMP 'stub-appsettings.json'
          $json = [IO.File]::ReadAllText($src)
          if (-not $json.Contains('[password of TestUser]')) { throw "TestUserPWD の雛形の値が見つかりません : $src" }
          [IO.File]::WriteAllText($dst, $json.Replace('[password of TestUser]', $env:STUB_TEST_USER_PWD))
          "STUB_APPSETTINGS=$dst" >> $env:GITHUB_ENV
          "OT_MPAS_PATH=$env:GITHUB_WORKSPACE/MultiPurposeAuthSite" >> $env:GITHUB_ENV

      - name: Start the stub
        id: stub
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/container/Stub
        run: |
          ./StubCompose.ps1 -Mtls
          # 起動の完了を待つ（Discovery が 200 を返すまで。最大 3 分）
          $ok = $false
          for ($i = 0; $i -lt 36; $i++)
          {
              try
              {
                  $r = Invoke-WebRequest -Uri 'https://localhost:44310/.well-known/openid-configuration' -SkipCertificateCheck -TimeoutSec 5
                  if ($r.StatusCode -eq 200) { $ok = $true; break }
              }
              catch { }
              Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw 'スタブが起動しませんでした（Discovery が 200 を返さない）' }

      # 4 本は、どれかが落ちても残りを回す（結果を全部見るため）
      - name: E2E FAPI 1.0 (SpRp_MVC)
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./MvcFapi1E2E.ps1 -StubAppSettings "$env:STUB_APPSETTINGS" -OutputDir "${{ runner.temp }}/E2E/fapi1"

      - name: E2E FAPI 2.0 (SpRp_MVC)
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./MvcFapi2E2E.ps1 -Mtls -StubAppSettings "$env:STUB_APPSETTINGS" -OutputDir "${{ runner.temp }}/E2E/fapi2"

      - name: E2E CLI login
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./CliLoginE2E.ps1 -StubAppSettings "$env:STUB_APPSETTINGS" -OutputDir "${{ runner.temp }}/E2E/cli"

      - name: E2E external login (MVC_Sample)
        if: ${{ !cancelled() && steps.stub.outcome == 'success' }}
        shell: pwsh
        working-directory: root/programs/CS/Sample4SpRp/E2E
        run: ./ExternalLoginE2E.ps1 -Lang CS -StubAppSettings "$env:STUB_APPSETTINGS" -OutputDir "${{ runner.temp }}/E2E/external"

      - name: Collect the stub log
        if: always()
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/E2E"
          docker compose -f MultiPurposeAuthSite/container/Stub/docker-compose.yml logs --no-color > "${{ runner.temp }}/E2E/stub.log" 2>&1 || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stub-logs-linux
          path: ${{ runner.temp }}/E2E
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # クロス DB の net48（#712）：Windows ランナー＋WSL2 の Docker
  # --------------------------------------------------------------------
  # 2_RunAllTests.ps1 -CrossDb -Wsl2 を回す。TestPublicDb を、SQL Server（必須）に Oracle・MySQL（net48・net10.0）・PostgreSQL（net10.0）を
  # 1 つずつ足して回す（linux-crossdb が回す net10.0 に加えて、Windows でしか動かない net48 を回す）。
  # DB のコンテナは、WSL2 の Ubuntu に入れた Docker（systemd）で、LocalServicesOnDocker の Start-Services_wsl2.ps1 が起動する。
  # windows-latest は Windows コンテナ用の docker を持つので、-Wsl2 で WSL2 版を選ばせる（自動の判定は Rancher Desktop 版を選ぶ）。
  # **build とは別の Windows ランナーで、基盤だけをビルドして回す**（build が作った出力は渡さない。net48 の TestPublicDb は、csproj を --no-build で回すため）。
  # 実験の結果は #711・#712。WSL2 の VM のメモリは 7940MB で、SQL Server と Oracle を合わせて約 5GB（1 つずつ起動する）。
  win-crossdb:
    if: ${{ !inputs.probe_win_sts }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      LSOD_REPO: NetDevInfraWGinOSSConsortium/LocalServicesOnDocker
      LSOD_REF: 269e717939033e230835d0325eec255c1e03f71a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout LocalServicesOnDocker
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LSOD_REPO }}
          ref: ${{ env.LSOD_REF }}
          path: LocalServicesOnDocker
          persist-credentials: false

      # build と同じ（理由もそちら）。構成ファイルが C:\root\files\... を絶対パスで参照する
      - name: Set up C:\root
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\root'))
          {
              New-Item -ItemType Junction -Path 'C:\root' -Target (Join-Path $env:GITHUB_WORKSPACE 'root') | Out-Null
          }
          Set-Culture ja-JP

      - name: Install WSL2 and Ubuntu
        shell: pwsh
        run: |
          wsl --update --web-download
          wsl --set-default-version 2
          wsl --install -d Ubuntu-24.04 --no-launch --web-download
          wsl --set-default Ubuntu-24.04
          wsl -d Ubuntu-24.04 -u root -- bash -c "uname -r; nproc; free -m"

      # systemd を有効にして、Docker（docker.io）が WSL の起動で自動的に上がるようにする
      # （LocalServicesOnDocker の WSL2 版は、Docker が動いている前提）
      - name: Install Docker in WSL2
        timeout-minutes: 25
        shell: pwsh
        run: |
          $script = @'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          printf '[boot]\nsystemd=true\n' > /etc/wsl.conf
          # archive.ubuntu.com が、ランナーから「接続がタイムアウト」で届かないことがある（run 44521316550。Canonical のアドレスへ 2 回とも）ので、
          # Azure の Ubuntu のミラー（Azure のランナーから届く）に替える
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          grep -h -E '^(URIs|deb )' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null | head -4 || true
          # apt が 7 分以上止まることがある（run 44479764197。2 回とも）ので、IPv4 に固定し、タイムアウトと再試行を付け、進み具合を表示する
          APT='-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          echo "== apt-get update : $(date)"
          apt-get $APT update
          echo "== apt-get install : $(date)"
          apt-get $APT install -y docker.io docker-compose-v2
          echo "== done : $(date)"
          systemctl enable docker || true
          '@
          # Windows の here-string は CRLF なので、LF にして書く（bash が行末の CR で落ちる）
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/docker-install.sh", $script.Replace("`r`n", "`n"))
          $unix = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ($env:RUNNER_TEMP -replace '\\','/')).Trim()
          # wsl が応答しなくなることがある（run 44476229163 で、このステップが 20 分止まった）ので、打ち切って 1 回やり直す
          $done = $false
          foreach ($attempt in 1, 2)
          {
              $p = Start-Process -FilePath wsl -ArgumentList @('-d','Ubuntu-24.04','-u','root','--','bash',"$unix/docker-install.sh") -PassThru -NoNewWindow
              if ($p.WaitForExit(420000) -and $p.ExitCode -eq 0) { $done = $true; break }
              "attempt $attempt failed (exited: $($p.HasExited))"
              if (-not $p.HasExited) { try { $p.Kill($true) } catch { } }
              wsl --shutdown
              Start-Sleep -Seconds 5
          }
          if (-not $done) { throw 'docker のインストールに失敗（2 回とも）' }
          # systemd を有効にするため、再起動する
          wsl --terminate Ubuntu-24.04
          Start-Sleep -Seconds 5
          $active = $false
          for ($i = 0; $i -lt 20; $i++)
          {
              $s = (wsl -d Ubuntu-24.04 -u root -- bash -c "systemctl is-active docker" 2>$null)
              "docker : $s"
              if ($s -eq 'active') { $active = $true; break }
              Start-Sleep -Seconds 3
          }
          if (-not $active) { throw 'WSL2 の docker が起動しませんでした' }
          wsl -d Ubuntu-24.04 -u root -- docker version --format '{{.Server.Version}}'

      # **SQL Server を、Windows のこの機械のアドレス（NIC）でも受けられるようにする**（run 44492153200 の診断）。
      #   SqlClient（.NET Framework）は、Data Source=localhost（と . と (local)）を「この機械」として、**ループバックではなく NIC のアドレスへ**つなぐ。
      #   WSL2 の Docker の公開ポートは、Windows ではループバック（127.0.0.1・::1）にだけ転送される（wslrelay）ので、localhost は拒否され、
      #   127.0.0.1・tcp:[::1],1433 は通る。手元（Rancher Desktop など）では、公開ポートが全アドレスで待ち受けるので、localhost が通る。
      #   テストの構成は Data Source=localhost のまま（build と同じ値を保つため）、NIC のアドレスの 1433 を、ループバックの 1433 へ転送する。
      #   **診断で確かめた**（run 44496978059）：転送の後は、localhost・.・(local)・tcp:localhost,1433・127.0.0.1・tcp:[::1],1433 のすべてが通り、TestPublicDb の SQL Server 22 件が通った。
      - name: Forward the NIC address to WSL2 for SQL Server
        shell: pwsh
        run: |
          $ip = ([Net.Dns]::GetHostAddresses($env:COMPUTERNAME) | Where-Object { $_.AddressFamily -eq 'InterNetwork' } | Select-Object -First 1).IPAddressToString
          "NIC address : $ip"
          netsh interface portproxy add v4tov4 listenaddress=$ip listenport=1433 connectaddress=127.0.0.1 connectport=1433
          if ($LASTEXITCODE -ne 0) { throw "netsh portproxy failed ($LASTEXITCODE)" }
          New-NetFirewallRule -DisplayName 'sqlserver-wsl2' -Direction Inbound -Protocol TCP -LocalPort 1433 -Action Allow | Out-Null
          netsh interface portproxy show all

      # 基盤だけをビルドする（TestPublicDb が参照する。1_BuildAll.ps1 -Only の基盤の 11 ステップ。SelectTargets.ps1 が出すもの）
      - name: Build the base
        shell: pwsh
        working-directory: root/programs
        run: .\1_BuildAll.ps1 -OutputDir "${{ runner.temp }}\BuildLogs" -Only 'Clean (net48 基盤)', 'Clean files (net48 基盤)', 'NuGet (net48)', 'Business (net48)', 'Business.RichClient (net48)', 'Clean (core 基盤)', 'Clean files (core 基盤)', 'NuGet (netcore100)', 'Business (netcore100)', 'Business.RichClient (core)', 'CopyAssemblies'

      - name: Run cross DB tests (net48 and net10.0)
        shell: pwsh
        working-directory: root/programs
        run: .\2_RunAllTests.ps1 -CrossDb -Wsl2 -LocalServicesDir "${{ github.workspace }}\LocalServicesOnDocker" -OutputDir "${{ runner.temp }}\TestResults"

      - name: Upload test results (cross DB, Windows)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-crossdb-windows
          path: |
            ${{ runner.temp }}/TestResults
            root/programs/CS/Frameworks/Tests/NUnit/TestResults/CrossDb/**
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # #712 の実験（一時）：Windows ランナーで IIS Express（HTTPS）と、WSL2 の Keycloak が使えるか（win-sts の前）
  # --------------------------------------------------------------------
  # 手動で probe_win_sts を true にしたときだけ回る（ほかのジョブは回らない）。
  # **実験が終わったら、このジョブと probe_win_sts の入力、ほかのジョブの `!inputs.probe_win_sts` を外す。**
  #   ・aspnet_state を起動できるか
  #   ・IIS Express の HTTPS（44300〜44399 の証明書の登録）が使えるか
  #   ・開発用証明書を、Windows の信頼に入れられるか
  #   ・Keycloak を WSL2 の Docker で起動して、Windows から https://localhost:44320 に届くか
  probe-win-sts:
    if: ${{ inputs.probe_win_sts }}
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: aspnet_state and IIS Express registrations
        shell: pwsh
        continue-on-error: true
        run: |
          "--- aspnet_state before"
          Get-Service aspnet_state | Format-Table Name, Status, StartType -AutoSize
          try { Start-Service aspnet_state -ErrorAction Stop; "started" } catch { "start failed: $($_.Exception.Message)" }
          Get-Service aspnet_state | Format-Table Name, Status, StartType -AutoSize
          "--- netsh http sslcert (4433xx / 4430xx)"
          netsh http show sslcert | Select-String -Pattern ':443[0-9][0-9]|IIS Express|Certificate Hash|Application ID' | Select-Object -First 30
          "--- certificates (LocalMachine\My / CurrentUser\My)"
          Get-ChildItem Cert:\LocalMachine\My, Cert:\CurrentUser\My | Select-Object PSParentPath, Subject, Thumbprint, NotAfter | Format-List
          "--- iisexpress version"
          (Get-Item "$env:ProgramFiles\IIS Express\iisexpress.exe").VersionInfo.FileVersion

      # IIS Express の HTTPS：1 回目・2 回目（run 44514441245・44519103461）は、既存の証明書（CN=localhost。0.0.0.0:44300〜 に登録済み）で、
      # localhost・127.0.0.1・[::1] のどれも「接続が強制的に閉じられた」で落ちた。**証明書の秘密鍵があるか**を見て、
      # 自分で作った自己署名の証明書（秘密鍵つき。LocalMachine\My と \Root）を 44333・44334 に登録し直して、もう一度試す
      - name: IIS Express over HTTPS (minimal site)
        shell: pwsh
        continue-on-error: true
        run: |
          "--- bound certificate (0.0.0.0:44333)"
          netsh http show sslcert ipport=0.0.0.0:44333
          Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.Subject -eq 'CN=localhost' } | ForEach-Object { "{0} HasPrivateKey={1} NotAfter={2}" -f $_.Thumbprint, $_.HasPrivateKey, $_.NotAfter }

          function Test-Iis([string]$label)
          {
              $site = Join-Path $env:RUNNER_TEMP 'site'
              New-Item -ItemType Directory -Force $site | Out-Null
              Set-Content -Path (Join-Path $site 'index.html') -Value 'hello iis express'
              $iis = Join-Path $env:ProgramFiles 'IIS Express\iisexpress.exe'
              $template = Join-Path $env:ProgramFiles 'IIS Express\config\templates\PersonalWebServer\applicationhost.config'
              $xmlSite = '<site name="E2E" id="1" serverAutoStart="true"><application path="/" applicationPool="Clr4IntegratedAppPool"><virtualDirectory path="/" physicalPath="' + $site + '" /></application><bindings><binding protocol="https" bindingInformation="*:44333:localhost" /></bindings></site>'
              $xml = [IO.File]::ReadAllText($template)
              $xml = [regex]::Replace($xml, '<site name="WebSite1"[\s\S]*?</site>', $xmlSite.Replace('$', '$$'))
              $config = Join-Path $env:RUNNER_TEMP 'applicationhost.config'
              [IO.File]::WriteAllText($config, $xml, (New-Object Text.UTF8Encoding $false))
              $log = Join-Path $env:RUNNER_TEMP 'iis.log'
              $p = Start-Process $iis -ArgumentList "/config:`"$config`"", '/site:E2E', '/systray:false' -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError "$log.err"
              Start-Sleep -Seconds 10
              "[$label] iisexpress exited: $($p.HasExited)"
              foreach ($skip in $true, $false)
              {
                  try
                  {
                      if ($skip) { $r = Invoke-WebRequest -Uri 'https://localhost:44333/index.html' -SkipCertificateCheck -TimeoutSec 15 }
                      else { $r = Invoke-WebRequest -Uri 'https://localhost:44333/index.html' -TimeoutSec 15 }
                      "[$label] https://localhost:44333 (skip cert check = $skip) : $($r.StatusCode) $($r.Content.Trim())"
                  }
                  catch { "[$label] https://localhost:44333 (skip cert check = $skip) : NG $($_.Exception.Message) / $($_.Exception.InnerException.Message)" }
              }
              if (-not $p.HasExited) { $p.Kill() }
              Start-Sleep -Seconds 2
          }

          Test-Iis 'existing certificate'

          "--- own self-signed certificate"
          $cert = New-SelfSignedCertificate -DnsName 'localhost' -CertStoreLocation 'Cert:\LocalMachine\My' -NotAfter (Get-Date).AddYears(1) -FriendlyName 'ci-localhost'
          "created : $($cert.Thumbprint) HasPrivateKey=$($cert.HasPrivateKey)"
          $root = New-Object Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
          $root.Open('ReadWrite')
          $root.Add($cert)
          $root.Close()
          foreach ($port in 44333, 44334)
          {
              netsh http delete sslcert ipport=0.0.0.0:$port | Out-Null
              netsh http add sslcert ipport=0.0.0.0:$port certhash=$($cert.Thumbprint) appid='{214124cd-d05b-4309-9af9-9caa44b2b74a}'
          }
          Test-Iis 'own certificate'

      # 開発用証明書（Keycloak の証明書の元）を作り、PEM で書き出す。Windows の信頼は、上の自己署名の証明書で足りる見込み
      - name: Development certificate (create, export)
        shell: pwsh
        continue-on-error: true
        working-directory: root/programs/CS/Sample4SpRp/container/KCK
        run: |
          New-Item -ItemType Directory -Force cert | Out-Null
          dotnet dev-certs https --export-path (Join-Path $PWD 'cert/localhost.pem') --format PEM --no-password
          Get-ChildItem cert | Format-Table Name, Length -AutoSize
          # 公開の証明書（Keycloak のクライアント証明書の信頼先）を写す
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'root/files/resource/X509/SHA256RSAClientCert.cer') (Join-Path $PWD 'cert/mpas-test-client.pem') -Force

      - name: Install WSL2 and Ubuntu
        id: wsl
        shell: pwsh
        run: |
          wsl --update --web-download
          wsl --set-default-version 2
          wsl --install -d Ubuntu-24.04 --no-launch --web-download
          wsl --set-default Ubuntu-24.04
          wsl -d Ubuntu-24.04 -u root -- bash -c "uname -r; nproc; free -m"

      - name: Install Docker in WSL2
        id: docker
        if: ${{ steps.wsl.outcome == 'success' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          $script = @'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          printf '[boot]\nsystemd=true\n' > /etc/wsl.conf
          # archive.ubuntu.com が、ランナーから「接続がタイムアウト」で届かないことがある（run 44521316550。Canonical のアドレスへ 2 回とも）ので、
          # Azure の Ubuntu のミラー（Azure のランナーから届く）に替える
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          grep -h -E '^(URIs|deb )' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null | head -4 || true
          APT='-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          apt-get $APT update
          apt-get $APT install -y docker.io docker-compose-v2
          systemctl enable docker || true
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/docker-install.sh", $script.Replace("`r`n", "`n"))
          $unix = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ($env:RUNNER_TEMP -replace '\\','/')).Trim()
          $done = $false
          foreach ($attempt in 1, 2)
          {
              $p = Start-Process -FilePath wsl -ArgumentList @('-d','Ubuntu-24.04','-u','root','--','bash',"$unix/docker-install.sh") -PassThru -NoNewWindow
              if ($p.WaitForExit(420000) -and $p.ExitCode -eq 0) { $done = $true; break }
              "attempt $attempt failed (exited: $($p.HasExited))"
              if (-not $p.HasExited) { try { $p.Kill($true) } catch { } }
              wsl --shutdown
              Start-Sleep -Seconds 5
          }
          if (-not $done) { throw 'docker install failed (2 attempts)' }
          wsl --terminate Ubuntu-24.04
          Start-Sleep -Seconds 5
          $active = $false
          for ($i = 0; $i -lt 20; $i++)
          {
              $s = (wsl -d Ubuntu-24.04 -u root -- bash -c "systemctl is-active docker" 2>$null)
              "docker : $s"
              if ($s -eq 'active') { $active = $true; break }
              Start-Sleep -Seconds 3
          }
          if (-not $active) { throw 'docker did not start in WSL2' }

      # KckCompose.ps1 は Windows の docker を呼ぶので、この実験では wsl 経由で docker compose を直接呼ぶ（WSL2 対応は ph2）
      # 1・2 回目（run 44514441245・44519103461）：Keycloak が 2 分ほどで Exited (143)（SIGTERM。OOM ではない）になり、上がらなかった。
      # WSL2 の VM は、wsl のプロセスが無いとアイドルで停止する（LocalServicesOnDocker の WSL2 版が、キープアライブを立てる理由）ので、
      # sleep infinity を動かし続けて、VM を止めない
      - name: Keycloak in WSL2, reachable from Windows
        if: ${{ steps.docker.outcome == 'success' }}
        shell: pwsh
        continue-on-error: true
        working-directory: root/programs/CS/Sample4SpRp/container/KCK
        run: |
          $compose = ((Resolve-Path 'docker-compose.yml').Path -replace '\\','/')
          $unix = (wsl -d Ubuntu-24.04 -u root -- wslpath -a $compose).Trim()
          "compose : $unix"
          $keep = Start-Process -FilePath wsl -ArgumentList @('-d','Ubuntu-24.04','-u','root','--','sleep','infinity') -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          wsl -d Ubuntu-24.04 -u root -- docker compose -f $unix up -d

          $sw = [Diagnostics.Stopwatch]::StartNew()
          $ok = $false
          while ($sw.Elapsed.TotalSeconds -lt 240 -and -not $ok)
          {
              foreach ($skip in $true, $false)
              {
                  try
                  {
                      if ($skip) { $r = Invoke-WebRequest -Uri 'https://localhost:44320/realms/sprp/.well-known/openid-configuration' -SkipCertificateCheck -TimeoutSec 10 }
                      else { $r = Invoke-WebRequest -Uri 'https://localhost:44320/realms/sprp/.well-known/openid-configuration' -TimeoutSec 10 }
                      "keycloak discovery (skip cert check = $skip) : $($r.StatusCode) after $([int]$sw.Elapsed.TotalSeconds) s"
                      if (-not $skip) { $ok = $true }
                  }
                  catch { }
              }
              if (-not $ok) { Start-Sleep -Seconds 5 }
          }
          "keycloak result : $ok after $([int]$sw.Elapsed.TotalSeconds) s"
          wsl -d Ubuntu-24.04 -u root -- bash -c "free -m; docker ps -a --format '{{.Names}} {{.Status}}'; docker inspect -f 'oom={{.State.OOMKilled}} exit={{.State.ExitCode}} running={{.State.Running}}' sprp-kck-keycloak-1; docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}'; docker logs --tail 12 sprp-kck-keycloak-1 2>&1"
          wsl -d Ubuntu-24.04 -u root -- docker compose -f $unix down
          if (-not $keep.HasExited) { $keep.Kill() }
