# runner の環境を調べる（実行結果を得るためだけのワークフロー）。
#
# ＜なぜ要るか＞
#   イメージの README を鵜呑みにすると外す。実際に、README には
#   「Visual Studio 2022 Enterprise 17.14」とあったが、流すと VS 18 Enterprise だった。
#   バージョンや実在に依存する判断は、ここで裏を取ってから行う。
#
# ＜現在の調査対象＞
#   3_SmokeTest.ps1（#517 段階 3）に足りないもの。
#     ・IIS Express … Web 系 3 件が使う
#     ・aspnet_state … net48 の Web 2 件が使う
#   DB は build-windows.yml が用意する SQL Server で足りる（/DAP SQL しか使わない）。
#
# 用が済んだら消してよい。残す場合は、調べたい項目を入れ替えて使う。

name: Probe runner environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: IIS Express
        shell: pwsh
        run: |
          # 3_SmokeTest.ps1 が見るのは %ProgramFiles% 側。
          # 32bit 側にしか無いこともあるため、両方を調べる。
          $paths = @(
              (Join-Path $env:ProgramFiles        'IIS Express\iisexpress.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'IIS Express\iisexpress.exe')
          )

          foreach ($p in $paths)
          {
              if (Test-Path $p)
              {
                  $v = (Get-Item $p).VersionInfo.FileVersion
                  Write-Host ("  [有] {0}  (v{1})" -f $p, $v)
              }
              else
              {
                  Write-Host ("  [無] {0}" -f $p)
              }
          }

      - name: aspnet_state
        shell: pwsh
        run: |
          $s = Get-Service aspnet_state -ErrorAction SilentlyContinue

          if ($null -eq $s)
          {
              Write-Host "  [無] aspnet_state サービスが存在しません。"
              return
          }

          Write-Host ("  [有] aspnet_state : Status={0} StartType={1}" -f $s.Status, $s.StartType)

          # 実際に開始できるかまで見る（runner は使い捨てなので影響は残らない）。
          try
          {
              Start-Service aspnet_state -ErrorAction Stop
              $s.Refresh()
              Write-Host ("  開始しました : Status={0}" -f $s.Status)
          }
          catch
          {
              Write-Host ("  開始できません : {0}" -f $_.Exception.Message)
          }

      - name: Summary
        shell: pwsh
        run: |
          # 判断材料として、イメージの素性も一緒に残す。
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("  OS       : {0} ({1})" -f $os.Caption, $os.Version)
          Write-Host ("  Image    : {0}" -f $env:ImageOS)
          Write-Host ("  Version  : {0}" -f $env:ImageVersion)
